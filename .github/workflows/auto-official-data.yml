name: Reconcile official data candidates

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_run:
    workflows: [Refresh source snapshot, Refresh trustee monthly returns]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: official-data-admission
  cancel-in-progress: false

jobs:
  connection:
    if: github.ref == 'refs/heads/main' && vars.OFFICIAL_DATA_AUTOPUBLISH == '1'
    permissions:
      contents: read
    uses: ./.github/workflows/check-data-connection.yml

  reconcile:
    needs: connection
    if: github.ref == 'refs/heads/main' && vars.OFFICIAL_DATA_AUTOPUBLISH == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact official data candidates and reconcile outstanding publication
        env:
          OFFICIAL_DATA_APP_LOGIN: ${{ vars.OFFICIAL_DATA_APP_LOGIN }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: python3 scripts/auto-official-reconcile.py
