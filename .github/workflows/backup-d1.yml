name: Backup D1

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Export D1
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          mkdir -p backup
          bunx wrangler d1 export kwmpf-staging --remote --skip-confirmation --output backup/d1.sql
          test -s backup/d1.sql
      - name: Build backup manifest
        run: |
          backup_id="d1-$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          exported_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          retention_until="$(date -u -d '+1 year' +%Y-%m-%dT%H:%M:%SZ)"
          bytes="$(wc -c < backup/d1.sql)"
          sha256="$(sha256sum backup/d1.sql | cut -d' ' -f1)"
          snapshot_id="$(bunx wrangler d1 execute kwmpf-staging --remote --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | jq -r '.[0].results[0].snapshot_id // "unknown"')"
          jq -n --arg backupId "$backup_id" --arg databaseName "kwmpf-staging" --arg snapshotId "$snapshot_id" --arg exportedAt "$exported_at" --arg retentionUntil "$retention_until" --arg key "d1.sql" --arg sha256 "$sha256" --argjson bytes "$bytes" '{backupId:$backupId,databaseName:$databaseName,snapshotId:$snapshotId,exportedAt:$exportedAt,retentionUntil:$retentionUntil,files:[{key:$key,bytes:$bytes,sha256:$sha256}]}' > backup/manifest.json
      - name: Upload backup to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          backup_id="$(jq -r .backupId backup/manifest.json)"
          bunx wrangler r2 object put "kwmpf-staging-raw/backups/$backup_id/d1.sql" --remote --file backup/d1.sql --content-type application/sql
          bunx wrangler r2 object put "kwmpf-staging-raw/backups/$backup_id/manifest.json" --remote --file backup/manifest.json --content-type application/json
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-manifest
          path: backup/manifest.json
          retention-days: 90
