name: Backup D1

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-d1-mutations
  cancel-in-progress: false

jobs:
  backup:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun's package download store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - name: Prepare staging Worker configuration
        run: scripts/render-worker-config.sh staging "$D1_DATABASE_ID" apps/api/wrangler.staging.json
      - name: Export D1
        id: export
        working-directory: apps/api
        run: |
          set -euo pipefail
          mkdir -p backup
          snapshot_before="$(bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 execute kwmpf-staging --remote --config wrangler.staging.json --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | jq -er '.[0].results[0].snapshot_id')"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 export kwmpf-staging --remote --skip-confirmation --config wrangler.staging.json --output backup/d1.sql
          test -s backup/d1.sql
          snapshot_after="$(bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 execute kwmpf-staging --remote --config wrangler.staging.json --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | jq -er '.[0].results[0].snapshot_id')"
          test "$snapshot_before" = "$snapshot_after"
          echo "snapshot_id=$snapshot_after" >> "$GITHUB_OUTPUT"
          echo "backup_id=d1-$(date -u +%Y-%m-%dT%H-%M-%SZ)-run-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Build backup manifest
        working-directory: apps/api
        run: |
          set -euo pipefail
          backup_id="${{ steps.export.outputs.backup_id }}"
          exported_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          snapshot_id="${{ steps.export.outputs.snapshot_id }}"
          bytes="$(wc -c < backup/d1.sql | tr -d '[:space:]')"
          sha256="$(sha256sum backup/d1.sql | cut -d' ' -f1)"
          jq -n --arg backupId "$backup_id" --arg databaseName "kwmpf-staging" --arg snapshotId "$snapshot_id" --arg exportedAt "$exported_at" --arg key "d1.sql" --arg sha256 "$sha256" --argjson bytes "$bytes" '{backupId:$backupId,databaseName:$databaseName,snapshotId:$snapshotId,exportedAt:$exportedAt,files:[{key:$key,bytes:$bytes,sha256:$sha256}]}' > backup/manifest.json
      - name: Upload backup to R2
        working-directory: apps/api
        run: |
          set -euo pipefail
          backup_id="$(jq -r .backupId backup/manifest.json)"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object put "kwmpf-staging-raw/backups/$backup_id/d1.sql" --remote --config wrangler.staging.json --file backup/d1.sql --content-type application/sql
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object put "kwmpf-staging-raw/backups/$backup_id/manifest.json" --remote --config wrangler.staging.json --file backup/manifest.json --content-type application/json
      - name: Verify backup from R2
        working-directory: apps/api
        run: |
          set -euo pipefail
          backup_id="$(jq -er '.backupId' backup/manifest.json)"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object get "kwmpf-staging-raw/backups/$backup_id/d1.sql" --remote --config wrangler.staging.json --file backup/readback-d1.sql
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object get "kwmpf-staging-raw/backups/$backup_id/manifest.json" --remote --config wrangler.staging.json --file backup/readback-manifest.json

          if ! cmp -s backup/manifest.json backup/readback-manifest.json; then
            echo "The uploaded R2 manifest differs from the local manifest." >&2
            exit 1
          fi
          expected_bytes="$(jq -er '.files[] | select(.key == "d1.sql") | .bytes' backup/manifest.json)"
          expected_sha256="$(jq -er '.files[] | select(.key == "d1.sql") | .sha256' backup/manifest.json)"
          actual_bytes="$(wc -c < backup/readback-d1.sql | tr -d '[:space:]')"
          actual_sha256="$(sha256sum backup/readback-d1.sql | cut -d' ' -f1)"
          if [[ "$actual_bytes" != "$expected_bytes" ]]; then
            echo "The downloaded D1 backup size does not match the manifest." >&2
            exit 1
          fi
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "The downloaded D1 backup SHA-256 does not match the manifest." >&2
            exit 1
          fi
          echo "R2 read-back verified: $actual_bytes bytes; SHA-256 matches the manifest." >> "$GITHUB_STEP_SUMMARY"

