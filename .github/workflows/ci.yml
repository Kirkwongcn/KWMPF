name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun's package download store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - run: bun run check

  high-risk-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require review evidence for high-risk paths
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          diff_base="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")"
          git diff --name-only "$diff_base" "$HEAD_SHA" >/tmp/changed-files.txt
          printf '%s\n' "$PR_BODY" >/tmp/pr-body.md
          scripts/check-high-risk-review.sh /tmp/changed-files.txt /tmp/pr-body.md
      - name: Keep source data reviewable separately from code
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          diff_base="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")"
          scripts/check-pr-composition.sh "$diff_base" "$HEAD_SHA"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Classify pull request E2E scope
        id: e2e-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base_sha="$(git rev-parse "origin/${BASE_REF}")"
          git diff --name-only -z "$base_sha" "$CHECKED_OUT_SHA" > /tmp/ci-changed-paths
          mapfile -d '' changed_paths < /tmp/ci-changed-paths

          run_e2e=true
          if ((${#changed_paths[@]} > 0)); then
            run_e2e=false
            for path in "${changed_paths[@]}"; do
              if [[ ! "$path" =~ ^data/sources/[0-9]{4}-[0-9]{2}-[0-9]{2}/(mpf-fund-platform|refresh-report)\.json$ ]]; then
                run_e2e=true
                break
              fi
            done
          fi

          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"
          if [[ "$run_e2e" == false ]]; then
            echo "Skipped Playwright E2E: every changed path is a platform source JSON snapshot; required verify and PR review checks still run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.e2e-scope.outputs.run_e2e != 'false'
        with:
          bun-version: 1.3.11
      - name: Cache Bun's package download store
        if: steps.e2e-scope.outputs.run_e2e != 'false'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
        if: steps.e2e-scope.outputs.run_e2e != 'false'
      - name: Install Playwright browser
        if: steps.e2e-scope.outputs.run_e2e != 'false'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        working-directory: apps/e2e
      - run: bun run e2e
        if: steps.e2e-scope.outputs.run_e2e != 'false'
      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e-scope.outputs.run_e2e != 'false'
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
