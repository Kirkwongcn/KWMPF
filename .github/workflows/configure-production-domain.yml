name: Configure production domain

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "move-domain-to-production" to confirm a public domain change'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: configure-production-domain
  cancel-in-progress: false

jobs:
  configure:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require an explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "move-domain-to-production" ]; then
            echo "Confirmation phrase did not match; refusing to move the domain." >&2
            exit 1
          fi
      - name: Move the custom domain to the production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: kwmpf.kirkwongcn.com
          FROM_PROJECT: kwmpf-web-staging
          TO_PROJECT: kwmpf-web-production
          ZONE: kirkwongcn.com
        run: |
          set -euo pipefail
          cf() { curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$@"; }
          pages_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"

          if cf "${pages_api}/${TO_PROJECT}/domains" \
            | jq -e --arg domain "${DOMAIN}" '.result[]? | select(.name == $domain)' >/dev/null; then
            echo "${DOMAIN} is already attached to ${TO_PROJECT}; nothing to move."
          else
            if cf "${pages_api}/${FROM_PROJECT}/domains" \
              | jq -e --arg domain "${DOMAIN}" '.result[]? | select(.name == $domain)' >/dev/null; then
              cf --request DELETE "${pages_api}/${FROM_PROJECT}/domains/${DOMAIN}" \
                | jq -e '.success == true' >/dev/null
              echo "Detached ${DOMAIN} from ${FROM_PROJECT}."
            else
              echo "${DOMAIN} was not attached to ${FROM_PROJECT}; continuing."
            fi
            cf --request POST \
              --header "Content-Type: application/json" \
              --data "$(jq -cn --arg name "${DOMAIN}" '{name: $name}')" \
              "${pages_api}/${TO_PROJECT}/domains" | jq -e '.success == true' >/dev/null
            echo "Attached ${DOMAIN} to ${TO_PROJECT}."
          fi

          zone_id="$(cf --get --data-urlencode "name=${ZONE}" \
            "https://api.cloudflare.com/client/v4/zones" \
            | jq -er '.result | if length == 1 then .[0].id else error("Expected one matching zone") end')"
          dns_api="https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records"
          records="$(cf --get --data-urlencode "name=${DOMAIN}" "${dns_api}")"
          record_count="$(jq '.result | length' <<<"${records}")"
          target="${TO_PROJECT}.pages.dev"
          if [[ "${record_count}" != "1" ]]; then
            echo "Expected exactly one DNS record for ${DOMAIN}, found ${record_count}." >&2
            exit 1
          fi
          if jq -e --arg content "${target}" \
            '.result[0] | .type == "CNAME" and .content == $content and .proxied == true' \
            <<<"${records}" >/dev/null; then
            echo "DNS record already points at ${target}."
          else
            record_id="$(jq -r '.result[0].id' <<<"${records}")"
            cf --request PATCH \
              --header "Content-Type: application/json" \
              --data "$(jq -cn --arg content "${target}" \
                '{type: "CNAME", content: $content, proxied: true, ttl: 1}')" \
              "${dns_api}/${record_id}" | jq -e '.success == true' >/dev/null
            echo "DNS record now points at ${target}."
          fi
      - name: Verify the domain serves the production deployment
        env:
          DOMAIN: kwmpf.kirkwongcn.com
          EXPECTED_API: https://kwmpf-api-production.kw-screener.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if html="$(curl --fail --silent --show-error "https://${DOMAIN}/")"; then
              bundle="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' <<<"${html}" | head -1)"
              if [ -n "${bundle}" ] \
                && curl --fail --silent --show-error "https://${DOMAIN}/${bundle}" \
                  | grep -qF "${EXPECTED_API}"; then
                echo "${DOMAIN} is serving the production build against ${EXPECTED_API}."
                exit 0
              fi
            fi
            echo "Attempt ${attempt}: not serving production yet; waiting."
            sleep 15
          done
          echo "${DOMAIN} did not serve the production build within the timeout." >&2
          exit 1
