name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-production" to confirm a public release'
        required: true
        type: string
      source_snapshot:
        description: "Official source snapshot to publish, e.g. 2026-08-29/mpf-fund-platform.json (no default: must match the newest batch in data/sources)"
        required: true
        type: string
      allow_older_snapshot:
        description: "Publish a batch older than the newest one in data/sources (only for a deliberate rollback)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-d1-mutations
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require an explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-production" ]; then
            echo "Confirmation phrase did not match; refusing to deploy." >&2
            exit 1
          fi
      - name: Require main and reuse successful checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must use the main branch." >&2
            exit 1
          fi
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
          conclusion="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha and .event == "push" and .head_branch == "main")) | sort_by(.run_started_at // .created_at) | last | .conclusion // empty' <<<"$runs")"
          if [[ "$conclusion" != "success" ]]; then
            echo "The CI run for $GITHUB_SHA on main is not successful (latest conclusion: ${conclusion:-none}). Wait for CI to pass, then dispatch production again." >&2
            exit 1
          fi
          echo "Reusing successful CI checks for $GITHUB_SHA."
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun's package download store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - name: Require a matching, reviewed source refresh report
        env:
          SOURCE_SNAPSHOT: ${{ inputs.source_snapshot }}
          ALLOW_OLDER: ${{ inputs.allow_older_snapshot }}
        run: bun scripts/check-production-source-review.mjs "$SOURCE_SNAPSHOT" "$ALLOW_OLDER"
      - name: Resolve the latest trustee-return candidate
        id: return-observations
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(data/coverage/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-official-return-observations-candidate.json)
          if ((${#candidates[@]} == 0)); then
            echo "No reviewed trustee return observation candidate exists." >&2
            exit 1
          fi
          path="$(printf '%s\n' "${candidates[@]}" | LC_ALL=C sort | tail -n 1)"
          test -s "$path"
          echo "Production will apply $path."
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Trustee return observations: $path" >> "$GITHUB_STEP_SUMMARY"
      - name: Build full production publication seed
        env:
          SOURCE_SNAPSHOT: ${{ inputs.source_snapshot }}
          RETURN_OBSERVATIONS: ${{ steps.return-observations.outputs.path }}
        run: |
          set -euo pipefail
          source_file="data/sources/$SOURCE_SNAPSHOT"
          return_file="$RETURN_OBSERVATIONS"
          source_as_of="$(jq -er '.sourceDataAsOf' "$source_file")"
          snapshot="snapshot-mpfa-platform-${source_as_of}-${GITHUB_SHA::12}"
          bun run --filter @kwmpf/coverage publication-seed -- --source "../../$source_file" --return-observations "../../$return_file" --output /tmp/kwmpf-production.sql --snapshot "$snapshot"
      - name: Prepare production Worker configuration
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: scripts/render-worker-config.sh production "$D1_DATABASE_ID" apps/api/wrangler.production.json
      - name: Back up the current production database before migrations
        id: pre-deploy-export
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          snapshot_before="$(bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 execute kwmpf-production --remote --config wrangler.production.json --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | jq -er '.[0].results[0].snapshot_id')"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 export kwmpf-production --remote --skip-confirmation --config wrangler.production.json --output /tmp/kwmpf-production-before-deploy.sql
          snapshot_after="$(bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 execute kwmpf-production --remote --config wrangler.production.json --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | jq -er '.[0].results[0].snapshot_id')"
          test "$snapshot_before" = "$snapshot_after"
          echo "snapshot_id=$snapshot_after" >> "$GITHUB_OUTPUT"
          echo "backup_id=d1-$(date -u +%Y-%m-%dT%H-%M-%SZ)-run-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Verify a production D1 rollback point before mutation
        id: rollback-point
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          timestamp="$(date -u +%s)"
          bunx wrangler d1 time-travel info kwmpf-production --timestamp "$timestamp" --config wrangler.production.json > /tmp/kwmpf-production-rollback-point.txt
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          cat /tmp/kwmpf-production-rollback-point.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the production database export and manifest in R2
        working-directory: apps/api
        env:
          BACKUP_ID: ${{ steps.pre-deploy-export.outputs.backup_id }}
          SNAPSHOT_ID: ${{ steps.pre-deploy-export.outputs.snapshot_id }}
          ROLLBACK_TIMESTAMP: ${{ steps.rollback-point.outputs.timestamp }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export_file=/tmp/kwmpf-production-before-deploy.sql
          manifest_file=/tmp/kwmpf-production-before-deploy.manifest.json
          test -s "$export_file"
          bytes="$(wc -c < "$export_file" | tr -d '[:space:]')"
          sha256="$(sha256sum "$export_file" | awk '{print $1}')"
          jq -n \
            --arg backupId "$BACKUP_ID" \
            --arg databaseName "kwmpf-production" \
            --arg snapshotId "$SNAPSHOT_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg exportedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg rollbackTimestamp "$ROLLBACK_TIMESTAMP" \
            --arg sha256 "$sha256" \
            --argjson bytes "$bytes" \
            '{backupId:$backupId,databaseName:$databaseName,snapshotId:$snapshotId,commit:$commit,runId:$runId,exportedAt:$exportedAt,rollbackTimestamp:$rollbackTimestamp,files:[{key:"d1.sql",bytes:$bytes,sha256:$sha256}]}' \
            > "$manifest_file"
          prefix="backups/$BACKUP_ID"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object put "kwmpf-production-raw/$prefix/d1.sql" --remote --config wrangler.production.json --file "$export_file" --content-type application/sql
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object put "kwmpf-production-raw/$prefix/manifest.json" --remote --config wrangler.production.json --file "$manifest_file" --content-type application/json
          {
            echo "Production pre-deploy backup: $BACKUP_ID"
            echo "R2 prefix: kwmpf-production-raw/$prefix"
            cat "$manifest_file"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production D1 backup from R2 before migrations
        working-directory: apps/api
        env:
          BACKUP_ID: ${{ steps.pre-deploy-export.outputs.backup_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          prefix="backups/$BACKUP_ID"
          export_file=/tmp/kwmpf-production-before-deploy.sql
          manifest_file=/tmp/kwmpf-production-before-deploy.manifest.json
          readback_file=/tmp/kwmpf-production-before-deploy-readback.sql
          readback_manifest_file=/tmp/kwmpf-production-before-deploy-readback.manifest.json

          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object get "kwmpf-production-raw/$prefix/d1.sql" --remote --config wrangler.production.json --file "$readback_file"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object get "kwmpf-production-raw/$prefix/manifest.json" --remote --config wrangler.production.json --file "$readback_manifest_file"

          if ! cmp -s "$manifest_file" "$readback_manifest_file"; then
            echo "The uploaded production backup manifest differs from the local manifest." >&2
            exit 1
          fi
          expected_bytes="$(jq -er '.files[] | select(.key == "d1.sql") | .bytes' "$manifest_file")"
          expected_sha256="$(jq -er '.files[] | select(.key == "d1.sql") | .sha256' "$manifest_file")"
          actual_bytes="$(wc -c < "$readback_file" | tr -d '[:space:]')"
          actual_sha256="$(sha256sum "$readback_file" | awk '{print $1}')"
          if [[ "$actual_bytes" != "$expected_bytes" ]]; then
            echo "The production D1 backup size does not match its manifest." >&2
            exit 1
          fi
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "The production D1 backup SHA-256 does not match its manifest." >&2
            exit 1
          fi
          echo "Production D1 backup read-back verified: $actual_bytes bytes; SHA-256 matches the manifest." >> "$GITHUB_STEP_SUMMARY"
      - name: Apply D1 migrations
        id: apply-migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply kwmpf-production --remote --config wrangler.production.json
      - name: Archive production source snapshot
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: r2 object put kwmpf-production-raw/candidates/${{ github.sha }}/source.json --remote --file ../../data/sources/${{ inputs.source_snapshot }}
      - name: Archive production return observations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: r2 object put kwmpf-production-raw/candidates/${{ github.sha }}/return-observations.json --remote --file ../../${{ steps.return-observations.outputs.path }}
      - name: Publish full production snapshot
        id: publish-snapshot
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 execute kwmpf-production --remote --config wrangler.production.json --file /tmp/kwmpf-production.sql
      - name: Deploy Worker
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --config wrangler.production.json --var RELEASE_VERSION:${{ github.sha }} --message KWMPF-release-run=${{ github.run_id }}-attempt=${{ github.run_attempt }}-sha=${{ github.sha }}
      - name: Build web against deployed API
        run: bun run --filter @kwmpf/web build
        env:
          VITE_API_URL: ${{ steps.deploy-worker.outputs.deployment-url }}
      - name: Deploy Pages
        id: deploy-pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: pages deploy ../web/dist --project-name kwmpf-web-production --branch main --commit-hash ${{ github.sha }} --commit-message KWMPF-release-run=${{ github.run_id }}-attempt=${{ github.run_attempt }}-sha=${{ github.sha }}
      - name: Verify the public deployment serves a published snapshot
        id: verify-publication
        run: |
          set -euo pipefail
          url="${{ steps.deploy-worker.outputs.deployment-url }}"
          summary=$(curl --fail --silent --show-error "$url/summary")
          echo "$summary"
          snapshot=$(jq -r '.snapshotId // "null"' <<<"$summary")
          funds=$(jq -r '.fundClassCount' <<<"$summary")
          echo "snapshot_id=$snapshot" >> "$GITHUB_OUTPUT"
          echo "fund_class_count=$funds" >> "$GITHUB_OUTPUT"
          if [ "$snapshot" = "null" ] || [ "$funds" -lt 1 ]; then
            echo "Public API is not serving a published snapshot." >&2
            exit 1
          fi
          echo "Serving snapshot $snapshot with $funds fund classes."
          three_year="$(curl --fail --silent --show-error "$url/rankings?metric=return&period=3")"
          three_year_rows="$(jq -r '.rankings | length' <<<"$three_year")"
          echo "three_year_rows=$three_year_rows" >> "$GITHUB_OUTPUT"
          if ((three_year_rows == 0)); then
            echo "Production has no eligible three-year return ranking rows." >&2
            exit 1
          fi
          echo "Serving $three_year_rows eligible three-year return ranking rows."
          cache=$(curl --fail --silent --show-error --dump-header - --output /dev/null "$url/summary" \
            | tr -d '\r' | awk 'tolower($1) == "cache-control:" { $1=""; sub(/^ /, ""); print }')
          echo "cache_control=$cache" >> "$GITHUB_OUTPUT"
          echo "Cache-Control: $cache"
          test "$cache" = "public, max-age=300, stale-while-revalidate=600"
      - name: Record and verify the production release tuple in private R2
        if: ${{ always() && steps.deploy-worker.outcome == 'success' && steps.deploy-pages.outcome == 'success' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_MARKER: KWMPF-release-run=${{ github.run_id }}-attempt=${{ github.run_attempt }}-sha=${{ github.sha }}
          SOURCE_SNAPSHOT: ${{ inputs.source_snapshot }}
          RETURN_OBSERVATIONS_PATH: ${{ steps.return-observations.outputs.path }}
          BACKUP_ID: ${{ steps.pre-deploy-export.outputs.backup_id }}
          ROLLBACK_TIMESTAMP: ${{ steps.rollback-point.outputs.timestamp }}
          WORKER_URL: ${{ steps.deploy-worker.outputs.deployment-url }}
          VERIFY_OUTCOME: ${{ steps.verify-publication.outcome }}
          PUBLISHED_SNAPSHOT_ID: ${{ steps.verify-publication.outputs.snapshot_id }}
          FUND_CLASS_COUNT: ${{ steps.verify-publication.outputs.fund_class_count }}
          THREE_YEAR_ROWS: ${{ steps.verify-publication.outputs.three_year_rows }}
          CACHE_CONTROL: ${{ steps.verify-publication.outputs.cache_control }}
        run: |
          set -euo pipefail
          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          worker_response=/tmp/kwmpf-worker-deployments.json
          pages_response=/tmp/kwmpf-pages-deployments.json
          manifest_file=/tmp/kwmpf-production-release.manifest.json
          readback_file=/tmp/kwmpf-production-release-readback.manifest.json

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api_base/workers/scripts/kwmpf-api-production/deployments?per_page=100" \
            > "$worker_response"
          jq -e '.success == true and (.result.deployments | length > 0)' "$worker_response" > /dev/null
          worker_deployment="$(jq -ce --arg marker "$RELEASE_MARKER" '
            .result.deployments[0]
            | select(.annotations["workers/message"] == $marker)
            | select((.id | type) == "string" and (.id | length) > 0)
            | select((.created_on | type) == "string" and (.created_on | length) > 0)
            | select((.versions | length) == 1)
            | select(.versions[0].percentage == 100)
            | select((.versions[0].version_id | type) == "string" and (.versions[0].version_id | length) > 0)
          ' "$worker_response")"

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --get "$api_base/pages/projects/kwmpf-web-production/deployments" \
            --data-urlencode "env=production" \
            > "$pages_response"
          jq -e '.success == true and (.result | length > 0)' "$pages_response" > /dev/null
          pages_deployment="$(jq -ce --arg marker "$RELEASE_MARKER" --arg sha "$GITHUB_SHA" '
            .result
            | map(select(.environment == "production"))
            | sort_by(.created_on)
            | last
            | select((.is_skipped // false) == false)
            | select(.latest_stage.status == "success")
            | select(.deployment_trigger.metadata.branch == "main")
            | select(.deployment_trigger.metadata.commit_hash == $sha)
            | select(.deployment_trigger.metadata.commit_message == $marker)
            | select((.id | type) == "string" and (.id | length) > 0)
            | select((.url | type) == "string" and (.url | length) > 0)
          ' "$pages_response")"

          source_file="../../data/sources/$SOURCE_SNAPSHOT"
          return_observations_file="../../$RETURN_OBSERVATIONS_PATH"
          backup_manifest_file=/tmp/kwmpf-production-before-deploy.manifest.json
          test -s "$source_file"
          test -s "$return_observations_file"
          test -s "$backup_manifest_file"
          source_data_as_of="$(jq -er '.sourceDataAsOf' "$source_file")"

          fund_count_json=null
          if [[ "$FUND_CLASS_COUNT" =~ ^[0-9]+$ ]]; then
            fund_count_json="$FUND_CLASS_COUNT"
          fi
          three_year_rows_json=null
          if [[ "$THREE_YEAR_ROWS" =~ ^[0-9]+$ ]]; then
            three_year_rows_json="$THREE_YEAR_ROWS"
          fi

          jq -n -S \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg releaseMarker "$RELEASE_MARKER" \
            --arg workerUrl "$WORKER_URL" \
            --arg sourcePath "data/sources/$SOURCE_SNAPSHOT" \
            --arg sourceDataAsOf "$source_data_as_of" \
            --arg sourceKey "candidates/$GITHUB_SHA/source.json" \
            --arg returnObservationsPath "data/coverage/$(basename "$RETURN_OBSERVATIONS_PATH")" \
            --arg returnObservationsKey "candidates/$GITHUB_SHA/return-observations.json" \
            --arg backupId "$BACKUP_ID" \
            --arg rollbackTimestamp "$ROLLBACK_TIMESTAMP" \
            --arg verifyOutcome "$VERIFY_OUTCOME" \
            --arg snapshotId "$PUBLISHED_SNAPSHOT_ID" \
            --argjson fundClassCount "$fund_count_json" \
            --argjson threeYearRows "$three_year_rows_json" \
            --arg cacheControl "$CACHE_CONTROL" \
            --slurpfile backupManifest "$backup_manifest_file" \
            --argjson worker "$worker_deployment" \
            --argjson pages "$pages_deployment" \
            '{schemaVersion:1,recordedAt:$recordedAt,repository:$repository,workflowRun:{id:$runId,attempt:$runAttempt,url:$runUrl,commit:$commit},releaseMarker:$releaseMarker,worker:{name:"kwmpf-api-production",url:$workerUrl,deploymentId:$worker.id,deployedOn:$worker.created_on,versionId:$worker.versions[0].version_id,trafficPercent:$worker.versions[0].percentage},pages:{project:"kwmpf-web-production",deploymentId:$pages.id,url:$pages.url,createdOn:$pages.created_on,environment:$pages.environment,branch:$pages.deployment_trigger.metadata.branch,commitHash:$pages.deployment_trigger.metadata.commit_hash,commitMessage:$pages.deployment_trigger.metadata.commit_message,stageStatus:$pages.latest_stage.status},databaseBeforeRelease:($backupManifest[0] + {r2Prefix:("backups/" + $backupId),rollbackTimestamp:$rollbackTimestamp}),publicationAfterRelease:{snapshotId:(if $snapshotId == "" or $snapshotId == "null" then null else $snapshotId end),sourceSnapshot:{path:$sourcePath,dataAsOf:$sourceDataAsOf,r2Key:$sourceKey},returnObservations:{path:$returnObservationsPath,r2Key:$returnObservationsKey}},smokeChecks:{workflowStepOutcome:$verifyOutcome,fundClassCount:$fundClassCount,threeYearRankingRows:$threeYearRows,cacheControl:(if $cacheControl == "" then null else $cacheControl end)}}' \
            > "$manifest_file"

          prefix="releases/$GITHUB_SHA/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object put "kwmpf-production-raw/$prefix/manifest.json" --remote --config wrangler.production.json --file "$manifest_file" --content-type application/json
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object get "kwmpf-production-raw/$prefix/manifest.json" --remote --config wrangler.production.json --file "$readback_file"
          if ! cmp -s "$manifest_file" "$readback_file"; then
            echo "The production release manifest differs from the R2 object read back." >&2
            exit 1
          fi

          manifest_sha256="$(sha256sum "$manifest_file" | awk '{print $1}')"
          {
            echo "Production release tuple manifest: kwmpf-production-raw/$prefix/manifest.json"
            echo "Manifest SHA-256: $manifest_sha256"
            echo "Worker deployment/version: $(jq -r '.worker.deploymentId + " / " + .worker.versionId' "$manifest_file")"
            echo "Pages deployment: $(jq -r '.pages.deploymentId' "$manifest_file")"
            echo "Pre-deploy D1 backup: $BACKUP_ID"
            echo "R2 read-back verified byte-for-byte."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore production D1 after a failed mutation before Worker deployment
        if: ${{ (failure() || cancelled()) && steps.rollback-point.outcome == 'success' && steps.apply-migrations.outcome != 'skipped' && steps.deploy-worker.outcome == 'skipped' }}
        env:
          ROLLBACK_TIMESTAMP: ${{ steps.rollback-point.outputs.timestamp }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api
        run: |
          set -euo pipefail
          echo "Restoring production D1 to its pre-deploy time-travel point."
          echo yes | bunx wrangler d1 time-travel restore kwmpf-production --timestamp "$ROLLBACK_TIMESTAMP" --config wrangler.production.json
      - name: Preserve the production D1 recovery point after attempting Worker deployment
        if: ${{ (failure() || cancelled()) && steps.rollback-point.outcome == 'success' && steps.apply-migrations.outcome != 'skipped' && steps.deploy-worker.outcome != 'skipped' }}
        env:
          ROLLBACK_TIMESTAMP: ${{ steps.rollback-point.outputs.timestamp }}
          BACKUP_ID: ${{ steps.pre-deploy-export.outputs.backup_id }}
        run: |
          {
            echo "Worker deployment was attempted; production D1 was not automatically restored because it may now be serving the new schema and publication."
            echo "Pre-deploy D1 time-travel timestamp: ${ROLLBACK_TIMESTAMP}"
            echo "R2 recovery prefix: kwmpf-production-raw/backups/${BACKUP_ID}"
            echo "Check the deployed Worker version and restore Worker and D1 together before taking manual recovery action."
          } >> "$GITHUB_STEP_SUMMARY"
