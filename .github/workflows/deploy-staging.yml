name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Resolve the newest source batch
        id: source
        run: |
          set -euo pipefail
          path="$(scripts/resolve-previous-snapshot.sh data/sources)"
          batch="$(basename "$(dirname "$path")")"
          as_of="$(jq -r .sourceDataAsOf "$path")"
          echo "Staging will publish $path (source data as of $as_of)."
          {
            echo "path=$path"
            echo "batch=$batch"
            echo "as_of=$as_of"
          } >> "$GITHUB_OUTPUT"
      - name: Build full staging publication seed
        run: bun run --filter @kwmpf/coverage publication-seed -- --source ../../${{ steps.source.outputs.path }} --output /tmp/kwmpf-staging.sql
      - name: Prepare staging Worker configuration
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: scripts/render-worker-config.sh staging "$D1_DATABASE_ID" apps/api/wrangler.staging.json
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply kwmpf-staging --remote --config wrangler.staging.json
      - name: Archive staging source snapshot
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: r2 object put kwmpf-staging-raw/candidates/mpfa-platform-${{ steps.source.outputs.as_of }}/${{ steps.source.outputs.batch }}-mpf-fund-platform.json --remote --file ../../${{ steps.source.outputs.path }}
      - name: Publish full staging snapshot
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 execute kwmpf-staging --remote --config wrangler.staging.json --file /tmp/kwmpf-staging.sql
      - name: Deploy Worker
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --config wrangler.staging.json --var RELEASE_VERSION:${{ github.sha }}
      - name: Build web against deployed API
        run: bun run --filter @kwmpf/web build
        env:
          VITE_API_URL: ${{ steps.deploy-worker.outputs.deployment-url }}
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: pages deploy ../web/dist --project-name kwmpf-web-staging --branch main
