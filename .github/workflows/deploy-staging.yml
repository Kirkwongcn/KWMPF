name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Prepare staging Worker configuration
        working-directory: apps/api
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          jq --arg id "$D1_DATABASE_ID" '.d1_databases[0].database_id = $id' wrangler.jsonc > wrangler.staging.json
      - name: Deploy Worker
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --config wrangler.staging.json --var RELEASE_VERSION:${{ github.sha }}
      - name: Build web against deployed API
        run: bun run --filter @kwmpf/web build
        env:
          VITE_API_URL: ${{ steps.deploy-worker.outputs.deployment-url }}/health
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name kwmpf-web-staging --branch main
