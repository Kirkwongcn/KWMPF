name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-d1-mutations
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main and reuse successful checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Staging deployments must use the main branch." >&2
            exit 1
          fi
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
          conclusion="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha and .event == "push" and .head_branch == "main")) | sort_by(.run_started_at // .created_at) | last | .conclusion // empty' <<<"$runs")"
          if [[ "$conclusion" != "success" ]]; then
            echo "The CI run for $GITHUB_SHA on main is not successful (latest conclusion: ${conclusion:-none}). Wait for CI to pass, then dispatch staging again." >&2
            exit 1
          fi
          echo "Reusing successful CI checks for $GITHUB_SHA."
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun's package download store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - name: Resolve the newest source batch
        id: source
        run: |
          set -euo pipefail
          path="$(scripts/resolve-previous-snapshot.sh data/sources)"
          batch="$(basename "$(dirname "$path")")"
          as_of="$(jq -r .sourceDataAsOf "$path")"
          echo "Staging will publish $path (source data as of $as_of)."
          {
            echo "path=$path"
            echo "batch=$batch"
            echo "as_of=$as_of"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve the latest trustee-return candidate
        id: return-observations
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(data/coverage/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-official-return-observations-candidate.json)
          if ((${#candidates[@]} == 0)); then
            echo "No reviewed trustee return observation candidate exists." >&2
            exit 1
          fi
          path="$(printf '%s\n' "${candidates[@]}" | LC_ALL=C sort | tail -n 1)"
          test -s "$path"
          echo "Staging will apply $path."
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Trustee return observations: $path" >> "$GITHUB_STEP_SUMMARY"
      - name: Build full staging publication seed
        run: bun run --filter @kwmpf/coverage publication-seed -- --source ../../${{ steps.source.outputs.path }} --return-observations ../../${{ steps.return-observations.outputs.path }} --output /tmp/kwmpf-staging.sql
      - name: Prepare staging Worker configuration
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: scripts/render-worker-config.sh staging "$D1_DATABASE_ID" apps/api/wrangler.staging.json
      - name: Back up the current staging database before migrations
        id: pre-deploy-export
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          snapshot_before="$(bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 execute kwmpf-staging --remote --config wrangler.staging.json --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | jq -er '.[0].results[0].snapshot_id')"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 export kwmpf-staging --remote --skip-confirmation --config wrangler.staging.json --output /tmp/kwmpf-staging-before-deploy.sql
          snapshot_after="$(bash ../../scripts/run-wrangler-redacted.sh bunx wrangler d1 execute kwmpf-staging --remote --config wrangler.staging.json --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | jq -er '.[0].results[0].snapshot_id')"
          test "$snapshot_before" = "$snapshot_after"
          echo "snapshot_id=$snapshot_after" >> "$GITHUB_OUTPUT"
          echo "backup_id=d1-$(date -u +%Y-%m-%dT%H-%M-%SZ)-run-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Verify a staging D1 rollback point before mutation
        id: rollback-point
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          timestamp="$(date -u +%s)"
          bunx wrangler d1 time-travel info kwmpf-staging --timestamp "$timestamp" --config wrangler.staging.json > /tmp/kwmpf-staging-rollback-point.txt
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          cat /tmp/kwmpf-staging-rollback-point.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the staging database export and manifest in R2
        working-directory: apps/api
        env:
          BACKUP_ID: ${{ steps.pre-deploy-export.outputs.backup_id }}
          SNAPSHOT_ID: ${{ steps.pre-deploy-export.outputs.snapshot_id }}
          ROLLBACK_TIMESTAMP: ${{ steps.rollback-point.outputs.timestamp }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export_file=/tmp/kwmpf-staging-before-deploy.sql
          manifest_file=/tmp/kwmpf-staging-before-deploy.manifest.json
          test -s "$export_file"
          bytes="$(wc -c < "$export_file" | tr -d '[:space:]')"
          sha256="$(sha256sum "$export_file" | awk '{print $1}')"
          jq -n \
            --arg backupId "$BACKUP_ID" \
            --arg databaseName "kwmpf-staging" \
            --arg snapshotId "$SNAPSHOT_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg exportedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg rollbackTimestamp "$ROLLBACK_TIMESTAMP" \
            --arg sha256 "$sha256" \
            --argjson bytes "$bytes" \
            '{backupId:$backupId,databaseName:$databaseName,snapshotId:$snapshotId,commit:$commit,runId:$runId,exportedAt:$exportedAt,rollbackTimestamp:$rollbackTimestamp,files:[{key:"d1.sql",bytes:$bytes,sha256:$sha256}]}' \
            > "$manifest_file"
          prefix="backups/$BACKUP_ID"
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object put "kwmpf-staging-raw/$prefix/d1.sql" --remote --config wrangler.staging.json --file "$export_file" --content-type application/sql
          bash ../../scripts/run-wrangler-redacted.sh bunx wrangler r2 object put "kwmpf-staging-raw/$prefix/manifest.json" --remote --config wrangler.staging.json --file "$manifest_file" --content-type application/json
          {
            echo "Staging pre-deploy backup: $BACKUP_ID"
            echo "R2 prefix: kwmpf-staging-raw/$prefix"
            cat "$manifest_file"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply D1 migrations
        id: apply-migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply kwmpf-staging --remote --config wrangler.staging.json
      - name: Archive staging source snapshot
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: r2 object put kwmpf-staging-raw/candidates/mpfa-platform-${{ steps.source.outputs.as_of }}/${{ steps.source.outputs.batch }}-mpf-fund-platform.json --remote --file ../../${{ steps.source.outputs.path }}
      - name: Archive staging return observations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: r2 object put kwmpf-staging-raw/candidates/mpfa-platform-${{ steps.source.outputs.as_of }}/${{ steps.source.outputs.batch }}-return-observations.json --remote --file ../../${{ steps.return-observations.outputs.path }}
      - name: Publish full staging snapshot
        id: publish-snapshot
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 execute kwmpf-staging --remote --config wrangler.staging.json --file /tmp/kwmpf-staging.sql
      - name: Deploy Worker
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --config wrangler.staging.json --var RELEASE_VERSION:${{ github.sha }}
      - name: Smoke-test the staged publication through the API
        run: |
          set -euo pipefail
          url="${{ steps.deploy-worker.outputs.deployment-url }}"
          summary="$(curl --fail --silent --show-error "$url/summary")"
          snapshot="$(jq -r '.snapshotId // empty' <<<"$summary")"
          funds="$(jq -r '.fundClassCount // 0' <<<"$summary")"
          test -n "$snapshot"
          test "$funds" -gt 0
          rankings="$(curl --fail --silent --show-error "$url/rankings?metric=return&period=1")"
          test "$(jq -r '.rankings | length' <<<"$rankings")" -gt 0
          three_year="$(curl --fail --silent --show-error "$url/rankings?metric=return&period=3")"
          three_year_rows="$(jq -r '.rankings | length' <<<"$three_year")"
          if ((three_year_rows == 0)); then
            echo "Staging has no eligible three-year return ranking rows." >&2
            exit 1
          fi
      - name: Build web against deployed API
        run: bun run --filter @kwmpf/web build
        env:
          VITE_API_URL: ${{ steps.deploy-worker.outputs.deployment-url }}
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: pages deploy ../web/dist --project-name kwmpf-web-staging --branch main
      - name: Restore the previous staging D1 state after a failed mutation
        if: ${{ (failure() || cancelled()) && steps.rollback-point.outcome == 'success' && steps.apply-migrations.outcome != 'skipped' && steps.deploy-worker.outcome == 'skipped' }}
        env:
          ROLLBACK_TIMESTAMP: ${{ steps.rollback-point.outputs.timestamp }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api
        run: |
          set -euo pipefail
          echo "Restoring staging D1 to its pre-deploy time-travel point."
          echo yes | bunx wrangler d1 time-travel restore kwmpf-staging --timestamp "$ROLLBACK_TIMESTAMP" --config wrangler.staging.json
      - name: Preserve the D1 recovery point after attempting Worker deployment
        if: ${{ (failure() || cancelled()) && steps.rollback-point.outcome == 'success' && steps.apply-migrations.outcome != 'skipped' && steps.deploy-worker.outcome != 'skipped' }}
        env:
          ROLLBACK_TIMESTAMP: ${{ steps.rollback-point.outputs.timestamp }}
          BACKUP_ID: ${{ steps.pre-deploy-export.outputs.backup_id }}
        run: |
          {
            echo "Worker deployment was attempted; staging D1 was not automatically restored because it may now be serving the new schema and publication."
            echo "Pre-deploy D1 time-travel timestamp: ${ROLLBACK_TIMESTAMP}"
            echo "R2 recovery prefix: kwmpf-staging-raw/backups/${BACKUP_ID}"
            echo "Check the deployed Worker version and restore Worker and D1 together before taking manual recovery action."
          } >> "$GITHUB_STEP_SUMMARY"
