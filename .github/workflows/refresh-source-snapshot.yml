name: Refresh source snapshot

on:
  schedule:
    - cron: "0 19 * * 2"
  workflow_dispatch:
    inputs:
      expected_fund_classes:
        description: Independent fund class count from the official asset size document
        required: false
        type: string
      expected_constituent_funds:
        description: Independent constituent fund count from the official asset size document
        required: false
        type: string
      expected_schemes:
        description: Independent scheme count from the official asset size document
        required: false
        type: string
      expected_trustees:
        description: Independent trustee count from the official asset size document
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-source-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    environment: official-data-pr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Recover previously prepared commit on rerun
        id: prior_plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/auto-official-producer.py recover

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun's package download store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile

      - name: Resolve the previous published source snapshot
        id: previous
        if: steps.prior_plan.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          snapshot="$(scripts/resolve-previous-snapshot.sh)"
          {
            echo "snapshot=${snapshot}"
            echo "data_as_of=$(jq -er '.sourceDataAsOf' "${snapshot}")"
            echo "counts_source=$(jq -er '.expectedCountsSource' "${snapshot}")"
            echo "previous_fund_classes=$(jq -er '.expectedCounts.fundClasses' "${snapshot}")"
            echo "previous_constituent_funds=$(jq -er '.expectedCounts.constituentFunds' "${snapshot}")"
            echo "previous_schemes=$(jq -er '.expectedCounts.schemes' "${snapshot}")"
            echo "previous_trustees=$(jq -er '.expectedCounts.trustees' "${snapshot}")"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch a candidate snapshot from the official fund platform
        id: fetch
        if: steps.prior_plan.outputs.recovered != 'true'
        continue-on-error: true
        env:
          EXPECTED_FUND_CLASSES: ${{ inputs.expected_fund_classes || steps.previous.outputs.previous_fund_classes }}
          EXPECTED_CONSTITUENT_FUNDS: ${{ inputs.expected_constituent_funds || steps.previous.outputs.previous_constituent_funds }}
          EXPECTED_SCHEMES: ${{ inputs.expected_schemes || steps.previous.outputs.previous_schemes }}
          EXPECTED_TRUSTEES: ${{ inputs.expected_trustees || steps.previous.outputs.previous_trustees }}
          COUNTS_SOURCE: ${{ steps.previous.outputs.counts_source }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/candidate /tmp/raw
          bun run coverage:fetch-platform \
            --output /tmp/candidate/mpf-fund-platform.json \
            --raw-dir /tmp/raw \
            --run-id "${GITHUB_RUN_ID}" \
            --expected-counts-source "${COUNTS_SOURCE}" \
            --expected-fund-classes "${EXPECTED_FUND_CLASSES}" \
            --expected-constituent-funds "${EXPECTED_CONSTITUENT_FUNDS}" \
            --expected-schemes "${EXPECTED_SCHEMES}" \
            --expected-trustees "${EXPECTED_TRUSTEES}" \
            2>&1 | tee /tmp/fetch-error.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the raw source archive
        if: always() && steps.prior_plan.outputs.recovered != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.run_attempt == 1 && format('raw-source-archive-{0}', github.run_id) || format('raw-source-archive-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
          path: /tmp/raw
          if-no-files-found: ignore
          retention-days: 30

      - name: Report a failed fetch for operator follow-up
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTS_SOURCE: ${{ steps.previous.outputs.counts_source }}
          PREVIOUS_SNAPSHOT: ${{ steps.previous.outputs.snapshot }}
        run: |
          set -euo pipefail
          {
            echo "自動擷取官方強積金基金平台失敗，候選批次沒有產生，公開網站未受影響。"
            echo
            echo "- 上一個快照：\`${PREVIOUS_SNAPSHOT}\`"
            echo "- 獨立數量核對來源：${COUNTS_SOURCE}"
            echo "- Workflow run：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "最常見原因是基金類別數量改變。數量守門是刻意的：請先在官方資產規模文件核對現行數量，"
            echo "再以 \`workflow_dispatch\` 重新執行並在輸入框填入新的數量。"
            echo
            echo '```'
            tail -c 4000 /tmp/fetch-error.log 2>/dev/null || echo "（沒有擷取到錯誤輸出）"
            echo '```'
          } > /tmp/issue-body.md
          label_exists="$(gh label list --limit 100 --json name --jq 'any(.[]; .name == "needs-triage")' || true)"
          label_args=()
          if [[ "$label_exists" == "true" ]]; then
            label_args+=(--label "needs-triage")
          else
            echo "No needs-triage label is available; creating an unlabelled follow-up issue."
            echo "No needs-triage label was available when the source-fetch issue was created." >> "$GITHUB_STEP_SUMMARY"
          fi
          gh issue create \
            --title "來源擷取失敗：需要核對官方來源（run ${GITHUB_RUN_ID}）" \
            --body-file /tmp/issue-body.md \
            "${label_args[@]}"
          exit 1

      - name: Build the readiness and anomaly reports
        id: report
        if: steps.prior_plan.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          batch_directory="$(date -u +%F)"
          echo "batch_directory=${batch_directory}" >> "$GITHUB_OUTPUT"
          bun run coverage:refresh-report \
            --candidate /tmp/candidate/mpf-fund-platform.json \
            --previous "${{ steps.previous.outputs.snapshot }}" \
            --batch "candidate-${GITHUB_RUN_ID}" \
            --publish-path "data/sources/${batch_directory}/mpf-fund-platform.json" \
            --deploy-input "${batch_directory}/mpf-fund-platform.json" \
            --output-json /tmp/candidate/refresh-report.json \
            --output-markdown /tmp/candidate/refresh-summary.md \
            | tee /tmp/refresh-outcome.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' /tmp/refresh-outcome.json >> "$GITHUB_OUTPUT"
          cat /tmp/candidate/refresh-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the exact platform PR commit
        id: plan
        if: steps.report.outputs.outcome != 'no_new_data' && steps.prior_plan.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.report.outputs.outcome }}
          CANDIDATE_DATA_AS_OF: ${{ steps.report.outputs.candidateDataAsOf }}
        run: |
          set -euo pipefail
          branch="data/source-snapshot-${CANDIDATE_DATA_AS_OF}-${GITHUB_RUN_ID}"
          directory="data/sources/${{ steps.report.outputs.batch_directory }}"
          mkdir -p "${directory}"
          cp /tmp/candidate/mpf-fund-platform.json "${directory}/mpf-fund-platform.json"
          cp /tmp/candidate/refresh-report.json "${directory}/refresh-report.json"
          bunx --no-install prettier --write "${directory}/mpf-fund-platform.json" "${directory}/refresh-report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add "${directory}"
          git commit -m "data: add the ${CANDIDATE_DATA_AS_OF} official source snapshot candidate"
          python3 scripts/auto-official-producer.py prepare "$branch" "data: ${CANDIDATE_DATA_AS_OF} 官方來源候選批次（${OUTCOME}）" /tmp/candidate/refresh-summary.md
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Preserve original candidate before pushing
        if: steps.plan.outputs.prepared == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: official-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/official-pr-plan
          if-no-files-found: error

      - name: Create a repository-scoped PR token
        id: app
        if: vars.OFFICIAL_DATA_AUTOPUBLISH == '1' && (steps.plan.outputs.prepared == 'true' || steps.prior_plan.outputs.recovered == 'true')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OFFICIAL_DATA_APP_ID }}
          private-key: ${{ secrets.OFFICIAL_DATA_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Open or verify the exact producer PR
        id: opened
        if: steps.plan.outputs.prepared == 'true' || steps.prior_plan.outputs.recovered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOPUBLISH: ${{ vars.OFFICIAL_DATA_AUTOPUBLISH }}
          APP_LOGIN: ${{ vars.OFFICIAL_DATA_APP_LOGIN }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/auto-official-producer.py open

      - name: Bind the producer run to the exact candidate commit
        if: steps.opened.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: official-data-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-head.txt
          if-no-files-found: error

      - name: Record that no new batch was published
        if: steps.report.outputs.outcome == 'no_new_data' && steps.prior_plan.outputs.recovered != 'true'
        run: echo "官方來源截至日期仍然是 ${{ steps.report.outputs.candidateDataAsOf }}，沒有開新的候選批次。"
