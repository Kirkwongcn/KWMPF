name: Refresh source snapshot

on:
  schedule:
    - cron: "0 19 * * 2"
  workflow_dispatch:
    inputs:
      expected_fund_classes:
        description: Independent fund class count from the official asset size document
        required: false
        type: string
      expected_constituent_funds:
        description: Independent constituent fund count from the official asset size document
        required: false
        type: string
      expected_schemes:
        description: Independent scheme count from the official asset size document
        required: false
        type: string
      expected_trustees:
        description: Independent trustee count from the official asset size document
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-source-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile

      - name: Resolve the previous published source snapshot
        id: previous
        run: |
          set -euo pipefail
          snapshot="$(scripts/resolve-previous-snapshot.sh)"
          {
            echo "snapshot=${snapshot}"
            echo "data_as_of=$(jq -er '.sourceDataAsOf' "${snapshot}")"
            echo "counts_source=$(jq -er '.expectedCountsSource' "${snapshot}")"
            echo "previous_fund_classes=$(jq -er '.expectedCounts.fundClasses' "${snapshot}")"
            echo "previous_constituent_funds=$(jq -er '.expectedCounts.constituentFunds' "${snapshot}")"
            echo "previous_schemes=$(jq -er '.expectedCounts.schemes' "${snapshot}")"
            echo "previous_trustees=$(jq -er '.expectedCounts.trustees' "${snapshot}")"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch a candidate snapshot from the official fund platform
        id: fetch
        continue-on-error: true
        env:
          EXPECTED_FUND_CLASSES: ${{ inputs.expected_fund_classes || steps.previous.outputs.previous_fund_classes }}
          EXPECTED_CONSTITUENT_FUNDS: ${{ inputs.expected_constituent_funds || steps.previous.outputs.previous_constituent_funds }}
          EXPECTED_SCHEMES: ${{ inputs.expected_schemes || steps.previous.outputs.previous_schemes }}
          EXPECTED_TRUSTEES: ${{ inputs.expected_trustees || steps.previous.outputs.previous_trustees }}
          COUNTS_SOURCE: ${{ steps.previous.outputs.counts_source }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/candidate /tmp/raw
          bun run coverage:fetch-platform \
            --output /tmp/candidate/mpf-fund-platform.json \
            --raw-dir /tmp/raw \
            --run-id "${GITHUB_RUN_ID}" \
            --expected-counts-source "${COUNTS_SOURCE}" \
            --expected-fund-classes "${EXPECTED_FUND_CLASSES}" \
            --expected-constituent-funds "${EXPECTED_CONSTITUENT_FUNDS}" \
            --expected-schemes "${EXPECTED_SCHEMES}" \
            --expected-trustees "${EXPECTED_TRUSTEES}" \
            2>&1 | tee /tmp/fetch-error.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the raw source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-source-archive-${{ github.run_id }}
          path: /tmp/raw
          if-no-files-found: ignore
          retention-days: 30

      - name: Report a failed fetch for operator follow-up
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTS_SOURCE: ${{ steps.previous.outputs.counts_source }}
          PREVIOUS_SNAPSHOT: ${{ steps.previous.outputs.snapshot }}
        run: |
          set -euo pipefail
          {
            echo "自動擷取官方強積金基金平台失敗，候選批次沒有產生，公開網站未受影響。"
            echo
            echo "- 上一個快照：\`${PREVIOUS_SNAPSHOT}\`"
            echo "- 獨立數量核對來源：${COUNTS_SOURCE}"
            echo "- Workflow run：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "最常見原因是基金類別數量改變。數量守門是刻意的：請先在官方資產規模文件核對現行數量，"
            echo "再以 \`workflow_dispatch\` 重新執行並在輸入框填入新的數量。"
            echo
            echo '```'
            tail -c 4000 /tmp/fetch-error.log 2>/dev/null || echo "（沒有擷取到錯誤輸出）"
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --title "來源擷取失敗：需要核對官方數量（run ${GITHUB_RUN_ID}）" \
            --body-file /tmp/issue-body.md \
            --label "data"
          exit 1

      - name: Build the readiness and anomaly reports
        id: report
        run: |
          set -euo pipefail
          batch_directory="$(date -u +%F)"
          echo "batch_directory=${batch_directory}" >> "$GITHUB_OUTPUT"
          bun run coverage:refresh-report \
            --candidate /tmp/candidate/mpf-fund-platform.json \
            --previous "${{ steps.previous.outputs.snapshot }}" \
            --batch "candidate-${GITHUB_RUN_ID}" \
            --publish-path "data/sources/${batch_directory}/mpf-fund-platform.json" \
            --deploy-input "${batch_directory}/mpf-fund-platform.json" \
            --output-json /tmp/candidate/refresh-report.json \
            --output-markdown /tmp/candidate/refresh-summary.md \
            | tee /tmp/refresh-outcome.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' /tmp/refresh-outcome.json >> "$GITHUB_OUTPUT"
          cat /tmp/candidate/refresh-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open a candidate batch pull request
        if: steps.report.outputs.outcome != 'no_new_data'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.report.outputs.outcome }}
          CANDIDATE_DATA_AS_OF: ${{ steps.report.outputs.candidateDataAsOf }}
        run: |
          set -euo pipefail
          branch="data/source-snapshot-${CANDIDATE_DATA_AS_OF}"
          if gh pr view "${branch}" --json number >/dev/null 2>&1; then
            gh pr comment "${branch}" --body \
              "另一次擷取再次產生 ${CANDIDATE_DATA_AS_OF} 的候選批次。此 PR 的分支未被覆寫，請繼續在這裡核對。Run：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            exit 0
          fi
          directory="data/sources/${{ steps.report.outputs.batch_directory }}"
          mkdir -p "${directory}"
          cp /tmp/candidate/mpf-fund-platform.json "${directory}/mpf-fund-platform.json"
          cp /tmp/candidate/refresh-report.json "${directory}/refresh-report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add "${directory}"
          git commit -m "data: add the ${CANDIDATE_DATA_AS_OF} official source snapshot candidate"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "data: ${CANDIDATE_DATA_AS_OF} 官方來源候選批次（${OUTCOME}）" \
            --body-file /tmp/candidate/refresh-summary.md

      - name: Record that no new batch was published
        if: steps.report.outputs.outcome == 'no_new_data'
        run: echo "官方來源截至日期仍然是 ${{ steps.report.outputs.candidateDataAsOf }}，沒有開新的候選批次。"
