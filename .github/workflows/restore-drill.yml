name: D1 Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: R2 backup directory, for example d1-2026-08-13T02-17-00Z-run-123456789
        required: true
        type: string
      source_environment:
        description: Environment where the source backup is stored; production uses its environment approval gate.
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  restore:
    environment: ${{ inputs.source_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_ID: ${{ inputs.backup_id }}
      SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun's package download store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - name: Prepare source environment Worker configuration
        run: scripts/render-worker-config.sh "$SOURCE_ENVIRONMENT" "$D1_DATABASE_ID" apps/api/wrangler.restore-source.json
      - name: Validate backup identifier
        run: |
          set -euo pipefail
          case "$SOURCE_ENVIRONMENT" in
            staging|production) ;;
            *) echo "Unsupported source environment." >&2; exit 1 ;;
          esac
          if [[ ! "$BACKUP_ID" =~ ^d1-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z(-run-[0-9]+)?$ ]]; then
            echo "The backup ID must use the generated d1-YYYY-MM-DDTHH-MM-SSZ[-run-ID] format." >&2
            exit 1
          fi
      - name: Download backup from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p restore-drill
          bucket="kwmpf-${SOURCE_ENVIRONMENT}-raw"
          bash scripts/run-wrangler-redacted.sh bunx wrangler r2 object get "$bucket/backups/$BACKUP_ID/d1.sql" --remote --config apps/api/wrangler.restore-source.json --file restore-drill/d1.sql
          bash scripts/run-wrangler-redacted.sh bunx wrangler r2 object get "$bucket/backups/$BACKUP_ID/manifest.json" --remote --config apps/api/wrangler.restore-source.json --file restore-drill/manifest.json
      - name: Verify backup integrity
        run: |
          set -euo pipefail
          test -s restore-drill/d1.sql
          test -s restore-drill/manifest.json
          jq -e --arg backup_id "$BACKUP_ID" '
            .backupId == $backup_id
            and .databaseName == ("kwmpf-" + env.SOURCE_ENVIRONMENT)
            and (.snapshotId | type == "string" and length > 0)
            and ([.files[]? | select(.key == "d1.sql")] | length) == 1
            and ([.files[]? | select(.key == "d1.sql") | .sha256 | select(type == "string" and test("^[a-f0-9]{64}$"))] | length) == 1
            and ([.files[]? | select(.key == "d1.sql") | .bytes | select(type == "number" and . > 0)] | length) == 1
          ' restore-drill/manifest.json >/dev/null
          expected="$(jq -r '.files[] | select(.key == "d1.sql") | .sha256' restore-drill/manifest.json)"
          actual="$(sha256sum restore-drill/d1.sql | cut -d' ' -f1)"
          test "$expected" = "$actual"
          expected_bytes="$(jq -r '.files[] | select(.key == "d1.sql") | .bytes' restore-drill/manifest.json)"
          actual_bytes="$(wc -c < restore-drill/d1.sql | tr -d '[:space:]')"
          test "$expected_bytes" = "$actual_bytes"
      - name: Restore to local D1
        run: |
          set -euo pipefail
          bunx wrangler d1 execute RESTORE_DB --local --config apps/api/wrangler.restore.jsonc --file restore-drill/d1.sql
          expected_snapshot_id="$(jq -r '.snapshotId' restore-drill/manifest.json)"
          query='SELECT
            (SELECT snapshot_id FROM current_publication WHERE singleton = 1) AS snapshot_id,
            (SELECT count(*) FROM current_publication WHERE singleton = 1) AS current_publication_rows,
            (SELECT count(*) FROM publication_snapshots) AS publication_snapshot_rows,
            (SELECT count(*) FROM fund_class_versions WHERE snapshot_id = (SELECT snapshot_id FROM current_publication WHERE singleton = 1)) AS fund_class_version_rows,
            (SELECT count(*) FROM comparison_group_stats WHERE snapshot_id = (SELECT snapshot_id FROM current_publication WHERE singleton = 1)) AS comparison_group_stat_rows'
          bunx wrangler d1 execute RESTORE_DB --local --config apps/api/wrangler.restore.jsonc --command "$query" --json > restore-drill/query.json
          jq -e --arg snapshot_id "$expected_snapshot_id" '
            .[0].results as $rows
            | ($rows | length) == 1
              and $rows[0].snapshot_id == $snapshot_id
              and $rows[0].current_publication_rows == 1
              and $rows[0].publication_snapshot_rows >= 1
              and $rows[0].fund_class_version_rows > 0
              and $rows[0].comparison_group_stat_rows > 0
          ' restore-drill/query.json >/dev/null
          jq -r '.[0].results[0] | "Restored snapshot: \(.snapshot_id); fund classes: \(.fund_class_version_rows); comparison groups: \(.comparison_group_stat_rows)."' restore-drill/query.json >> "$GITHUB_STEP_SUMMARY"
