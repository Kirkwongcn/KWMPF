name: D1 Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: R2 backup directory, for example d1-2026-08-13T02-17-00Z
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Download backup from R2
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p restore-drill
          bunx wrangler r2 object get "kwmpf-staging-raw/backups/$BACKUP_ID/d1.sql" --remote --file restore-drill/d1.sql
          bunx wrangler r2 object get "kwmpf-staging-raw/backups/$BACKUP_ID/manifest.json" --remote --file restore-drill/manifest.json
      - name: Verify backup integrity
        run: |
          expected="$(jq -r '.files[] | select(.key == "d1.sql") | .sha256' restore-drill/manifest.json)"
          actual="$(sha256sum restore-drill/d1.sql | cut -d' ' -f1)"
          test -n "$expected"
          test "$expected" = "$actual"
          test "$(jq -r '.databaseName' restore-drill/manifest.json)" = "kwmpf-staging"
      - name: Restore to local D1
        run: |
          bunx wrangler d1 execute RESTORE_DB --local --config apps/api/wrangler.restore.jsonc --file restore-drill/d1.sql
          bunx wrangler d1 execute RESTORE_DB --local --config apps/api/wrangler.restore.jsonc --command 'SELECT snapshot_id FROM current_publication WHERE singleton = 1' --json | tee restore-drill/query.json
          test "$(jq -r '.[0].results | length' restore-drill/query.json)" = "1"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-restore-drill-${{ inputs.backup_id }}
          path: restore-drill/manifest.json
          retention-days: 90
