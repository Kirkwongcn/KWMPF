<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>找不到頁面｜KWMPF</title>
    <style>
      :root {
        --kw-paper: #f6f5f1;
        --kw-ink: #16252c;
        --kw-navy: #123b46;
        --kw-action: #0f414e;
        --kw-muted: #738086;
        --kw-gold: #c7a66a;
        --kw-white: #fff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--kw-paper);
        color: var(--kw-ink);
        font-family:
          "Helvetica Neue",
          -apple-system,
          "PingFang HK",
          "Microsoft JhengHei",
          sans-serif;
      }
      header {
        background: var(--kw-navy);
        color: var(--kw-white);
        padding: 1.25rem 1.5rem;
      }
      .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
      }
      .kicker {
        color: var(--kw-gold);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      main {
        flex: 1;
        max-width: 42rem;
        padding: 3.5rem 1.5rem;
        margin: 0 auto;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        margin: 0 0 0.75rem;
        color: var(--kw-navy);
      }
      p {
        color: var(--kw-muted);
        line-height: 1.7;
        margin: 0 0 1.5rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        background: var(--kw-action);
        color: var(--kw-white);
        text-decoration: none;
        font-size: 0.9rem;
      }
      footer {
        border-top: 1px solid #d9ddd8;
        padding: 1.5rem;
        color: var(--kw-muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="kicker">Kirk Wong Research</div>
      <div class="brand">KWMPF</div>
    </header>
    <main>
      <h1>找不到這個頁面</h1>
      <p>
        網址可能已經更改，或該基金類別不再收錄於目前的公開快照。你可以由下列入口重新查閱。
      </p>
      <div class="links">
        <a href="/">返回首頁</a>
        <a href="/funds">按條件瀏覽基金</a>
        <a href="/rankings">查看基金排名</a>
        <a href="/schemes">比較強積金計劃</a>
      </div>
    </main>
    <footer>本網站只提供資料比較及投資教育，不構成投資建議。</footer>
  </body>
</html>
